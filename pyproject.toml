[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gau-maple"
version = "0.10.0"
description = "Gaussian External adapter for MAPLE calculators"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy>=1.20",
    "ase>=3.22",
    "tomli>=2; python_version < '3.11'",
]

[project.scripts]
gau-maple = "gau_maple.external:main"
gau-maple-server = "gau_maple.server:main"
gau-maple-ping = "gau_maple.ping:main"
gau-maple-ctl = "gau_maple.control:main"
gau-maple-freqcheck = "gau_maple.freqcheck:main"
gau-maple-workflow = "gau_maple.workflow:main"
gau-maple-doctor = "gau_maple.doctor:main"
gau-maple-validation = "gau_maple.validation:main"

[project.optional-dependencies]
test = [
    "pytest>=7",
]
release = [
    "build>=1.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/ycj04/Gau_MAPLE"
Repository = "https://github.com/ycj04/Gau_MAPLE"
Issues = "https://github.com/ycj04/Gau_MAPLE/issues"
